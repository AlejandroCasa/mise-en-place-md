services:
  postgres:
    image: postgres:16-alpine
    container_name: gastronomy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastronomy}
      POSTGRES_USER: ${POSTGRES_USER:-gastronomy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gastronomy_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastronomy} -d ${POSTGRES_DB:-gastronomy}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gastronomy_pgdata:
    name: gastronomy_pgdata
